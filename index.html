<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}
/* Layout: en blåbärsmörk titelyta överst, små receptrutor som navet, nedre flikrad på telefon.
   Färg: blåbär (hero), lingon (accent), gul (stjärnor), dill (lagad). Varje kokbok får en egen nyans. */
:root{
  --bg:#F0F5EE; --surface:#FFFFFF; --surface-2:#E3ECE2; --ink:#14281D; --ink-2:#4B6152; --line:#D0DDCF;
  --accent:#23744A; --accent-ink:#FFFFFF; --accent-soft:#DDEEE2;
  --hero:#173A2A; --hero-ink:#FFFFFF; --hero-ink-2:#BFDCC8; --hero-line:rgba(255,255,255,.16);
  --heart:#C2334D; --yolk:#F2C94C; --star:#D99A00; --good:#1F7A4D; --good-soft:#D9F0E2;
  --warn:#8F4F00; --warn-soft:#FFEBCF; --danger:#B3261E; --danger-soft:#FBE3E1;
  --bk-band-s:55%; --bk-band-l:40%; --bk-tint-s:45%; --bk-tint-l:94%; --bk-line-s:28%; --bk-line-l:82%;
  --shadow:0 1px 2px rgba(20,40,29,.08),0 6px 18px rgba(20,40,29,.07);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1712; --surface:#16221B; --surface-2:#1F2E25; --ink:#E8F2EA; --ink-2:#A3B8AA; --line:#2B3E32;
  --accent:#6CCB93; --accent-ink:#06210F; --accent-soft:#1D3A2A;
  --hero:#163626; --hero-ink:#FFFFFF; --hero-ink-2:#BFDCC8; --hero-line:rgba(255,255,255,.16);
  --heart:#FF8DA1; --yolk:#F2C94C; --star:#F3BB3B; --good:#6FD79B; --good-soft:#173826;
  --warn:#F2AD58; --warn-soft:#38270F; --danger:#FF9088; --danger-soft:#3E1B18;
  --bk-band-s:45%; --bk-band-l:55%; --bk-tint-s:22%; --bk-tint-l:17%; --bk-line-s:20%; --bk-line-l:26%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1712; --surface:#16221B; --surface-2:#1F2E25; --ink:#E8F2EA; --ink-2:#A3B8AA; --line:#2B3E32;
  --accent:#6CCB93; --accent-ink:#06210F; --accent-soft:#1D3A2A;
  --hero:#163626; --hero-ink:#FFFFFF; --hero-ink-2:#BFDCC8; --hero-line:rgba(255,255,255,.16);
  --heart:#FF8DA1; --yolk:#F2C94C; --star:#F3BB3B; --good:#6FD79B; --good-soft:#173826;
  --warn:#F2AD58; --warn-soft:#38270F; --danger:#FF9088; --danger-soft:#3E1B18;
  --bk-band-s:45%; --bk-band-l:55%; --bk-tint-s:22%; --bk-tint-l:17%; --bk-line-s:20%; --bk-line-l:26%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
html.lock,html.lock body{overflow:hidden}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* Titelyta */
.hero .more{position:relative}
.hero{position:relative;z-index:55;margin-top:max(10px,env(safe-area-inset-top,0px));background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px 20px 18px;overflow:hidden;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;z-index:-1}
.hero::before{width:200px;height:200px;right:-70px;bottom:-130px;background:radial-gradient(circle,var(--hero) 0 38%,transparent 39%),repeating-radial-gradient(circle,rgba(242,201,76,.9) 0 3px,transparent 3px 12px);opacity:.32}
.hero::after{width:96px;height:96px;right:56px;bottom:-62px;background:#5DB37E;opacity:.9}
.hero-top{display:flex;align-items:flex-start;gap:10px}
.hero h1{font-size:clamp(28px,8.2vw,64px);font-weight:800;letter-spacing:-.035em;line-height:.95;font-variation-settings:'opsz' 96;overflow-wrap:normal}
.hero-row{display:flex;align-items:flex-end;gap:12px;margin-top:10px}
.hero-row .sub{margin:0;flex:1;min-width:0}
.hero .sub{color:var(--hero-ink-2);font-size:14.5px;max-width:34ch}
.hero .more{border:1px solid var(--hero-line);background:rgba(255,255,255,.08);color:var(--hero-ink);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.hero .more:hover{background:rgba(255,255,255,.18)}
.hero.slim{padding:12px 16px}
.hero.slim .hero-row{display:none}
.hero.slim .hero-top{align-items:center}
.hero.slim h1{font-size:26px}
.hero.slim .sub,.hero.slim::before,.hero.slim::after{display:none}

/* Flikar: nedre fält på telefon, i titelytan på större skärmar */
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:700;color:var(--ink-2);display:flex;gap:8px;align-items:center;justify-content:center;min-height:44px;flex:1}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:55;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--surface);border-top:1px solid var(--line);gap:8px}
.tab svg.i{width:22px;height:22px}
@media (min-width:760px){
  body{padding-block:0 48px}
  .tabs{position:static;background:none;border:0;padding:0;margin-top:16px;display:inline-flex;gap:6px;background:rgba(255,255,255,.1);border-radius:999px;padding:4px}
  .tab{flex:none;color:var(--hero-ink-2);padding:8px 18px}
  .tab[aria-selected="true"]{background:var(--hero-ink);color:var(--hero)}
}

/* Knappar och fält */
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.big{min-height:56px;font-size:16.5px;padding:0 22px;border-radius:16px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.dangerfill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ib{width:44px;min-height:44px;padding:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lab{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.inp,select.inp,textarea.inp{width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
textarea.inp{min-height:96px;resize:vertical}
.inp.bad{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}

/* Chips */
.chip{display:inline-flex;gap:6px;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
button.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tagc{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:6px;background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.pill{display:inline-flex;gap:5px;align-items:center;min-height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.mut{background:var(--surface-2);color:var(--ink-2)}
.stars{display:inline-flex;gap:1px;color:var(--star)}
.stars svg{width:15px;height:15px}

/* Sök och filter */
.tools{display:flex;flex-direction:column;gap:10px;margin:16px 0 12px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.searchbox .inp{padding-left:42px;border-radius:999px;min-height:50px;box-shadow:var(--shadow);font-size:16px}
.toolrow{display:flex;gap:8px;align-items:center}

<script>
/* ===== Ren logik (utan DOM). Testas separat i Node. ===== */
var Core = (function () {
  'use strict';

  var DEFAULT_TAGS = ['Snacks', 'Förrätt', 'Varmrätt', 'Efterrätt', 'Sås', 'Tillbehör', 'Dryck', 'Bakverk'];
  var WEB_BOOK_ID = 'webbrecept';

  function uid() {
    var a = new Uint8Array(9);
    globalThis.crypto.getRandomValues(a);
    var s = '';
    for (var i = 0; i < a.length; i++) s += a[i].toString(36).padStart(2, '0');
    return Date.now().toString(36) + s;
  }

  /* ---------- Text ---------- */
  function normName(s) {
    return String(s == null ? '' : s).normalize('NFC').toLowerCase()
      .replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  }
  function collator() { return new Intl.Collator('sv', { sensitivity: 'base', numeric: true }); }
  function pageNum(p) {
    if (p == null) return NaN;
    var m = String(p).match(/\d+/);
    return m ? parseInt(m[0], 10) : NaN;
  }

  /* ---------- Länkar ---------- */
  function normalizeUrl(u) {
    try {
      var x = new URL(String(u).trim());
      x.hash = '';
      var drop = [];
      x.searchParams.forEach(function (_, k) { if (/^(utm_|fbclid|gclid|mc_|igshid)/i.test(k)) drop.push(k); });
      drop.forEach(function (k) { x.searchParams.delete(k); });
      var host = x.hostname.toLowerCase().replace(/^www\./, '');
      var path = x.pathname.replace(/\/+$/, '');
      var q = x.searchParams.toString();
      return host + path + (q ? '?' + q : '');
    } catch (e) { return null; }
  }
  function cleanUrl(u) {
    var s = String(u || '').trim();
    if (!s) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'https://' + s;
    try {
      var x = new URL(s);
      if (x.protocol !== 'http:' && x.protocol !== 'https:') return null;
      if (!/\./.test(x.hostname)) return null;
      return x.href;
    } catch (e) { return null; }
  }
  function siteOf(u) {
    try { return new URL(u).hostname.replace(/^www\./i, ''); } catch (e) { return ''; }
  }
  /* Förslag på namn utifrån länken när sidan inte kan läsas. */
  function nameFromUrl(u) {
    try {
      var x = new URL(u);
      var segs = x.pathname.split('/').filter(Boolean);
      var best = '';
      for (var i = segs.length - 1; i >= 0; i--) {
        var s = segs[i];
        try { s = decodeURIComponent(s); } catch (e) { /* behåll */ }
        s = s.replace(/\.(html?|php|aspx?)$/i, '');
        if (/^[\d-]+$/.test(s)) continue;
        if (/^(recept|recipe|recipes|mat|kok|receptbanken)$/i.test(s)) continue;
        best = s; break;
      }
      if (!best) return '';
      best = best.replace(/[-_+]+/g, ' ').replace(/\b\d{5,}\b/g, '').replace(/\s+/g, ' ').trim();
      if (!best) return '';
      return best.charAt(0).toUpperCase() + best.slice(1);
    } catch (e) { return ''; }
  }
  /* Läser titel ur HTML-text (om en sida alls kunde hämtas). */
  function titleFromHtml(html) {
    var out = '';
    var og = html.match(/<meta[^>]+property=["']og:title["'][^>]*content=["']([^"']+)["']/i) ||
             html.match(/<meta[^>]+content=["']([^"']+)["'][^>]*property=["']og:title["']/i);
    if (og) out = og[1];
    if (!out) {
      var ld = html.match(/"@type"\s*:\s*"Recipe"[\s\S]{0,2000}?"name"\s*:\s*"([^"]+)"/i);

    }

/* Tangentbordet på mobil: håll dialogen inom den synliga delen så att knapparna i botten syns,

(function () {
  const vv = window.visualViewport; if (!vv) return;
  const de = document.documentElement.style;
  const sync = () => {
    const kb = window.innerHeight - vv.height - vv.offsetTop > 80;
    if (kb) { de.setProperty('--vvh', vv.height + 'px'); de.setProperty('--vvt', vv.offsetTop + 'px'); }
    else { de.removeProperty('--vvh'); de.removeProperty('--vvt'); }
  };
  vv.addEventListener('resize', sync); vv.addEventListener('scroll', sync);
  document.addEventListener('focusin', e => {
    const t = e.target; if (!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || !t.closest('.sheet')) return;
    setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) { /* */ } }, 300);
  });
})();
document.addEventListener('keydown', e => {
  const top = sheets[sheets.length - 1];
  if (!top) return;
  if (e.key === 'Escape') { e.preventDefault(); top.close(); return; }
  if (e.key === 'Tab') {
    const f = [...top.el.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select,textarea,[tabindex="0"]')].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === top.el)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- Lagring (IndexedDB) ---------- */
const DB_NAME = 'receptsamlingen', DB_VERSION = 1;
const STORES = ['books', 'recipes', 'tags', 'photos', 'meta'];
const Store = {
  db: null, volatile: false, mem: null,
  open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('IndexedDB saknas'));
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { return reject(e); }
      req.onupgradeneeded = ev => {
        const db = req.result;
        // Skapa bara det som saknas. Befintliga data rörs aldrig vid uppgradering.
        STORES.forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: n === 'meta' ? 'key' : 'id' }); });
        // Framtida versioner: kör migreringar utifrån ev.oldVersion här, utan att tömma lager.
      };
      req.onsuccess = () => {
        Store.db = req.result;
        Store.db.onversionchange = () => { Store.db.close(); toast('Appen uppdaterades i en annan flik. Ladda om sidan.', { bad: true }); };
        resolve();
      };
      req.onerror = () => reject(req.error || new Error('Kunde inte öppna lagringen'));
      req.onblocked = () => reject(new Error('Lagringen är blockerad av en annan flik'));
    });
  },
  async init() {
    try {
      await Store.open();
      // Prova att skriva och läsa innan vi litar på lagringen.
      await Store.commit([{ s: 'meta', put: { key: 'probe', value: Date.now() } }]);
      const p = await Store.loadAll();
      if (!p.meta.some(m => m.key === 'probe')) throw new Error('Lagringen sparade inte testposten');
    } catch (e) {
      console.warn('Lagring ej tillgänglig, kör utan att spara', e);
      Store.volatile = true; Store.db = null; Store.mem = { books: [], recipes: [], tags: [], photos: [], meta: [] };
    }
  },
  loadAll() {
    if (Store.volatile) return Promise.resolve(JSON.parse(JSON.stringify(Store.mem)));
    return new Promise((resolve, reject) => {
      const out = {};
      const t = Store.db.transaction(STORES, 'readonly');
      STORES.forEach(n => { const r = t.objectStore(n).getAll(); r.onsuccess = () => { out[n] = r.result; }; });
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('Läsningen avbröts'));
    });
  },
  /* ops: [{s, put}|{s, del}]. Allt eller inget i en transaktion. */
  commit(ops) {
    if (Store.volatile) return Promise.resolve();
    return new Promise((resolve, reject) => {
      let t;
      try {
        t = Store.db.transaction([...new Set(ops.map(o => o.s))], 'readwrite');
        ops.forEach(o => { const os = t.objectStore(o.s); if (o.put) os.put(o.put); else os.delete(o.del); });
      } catch (e) { return reject(e); }
      t.oncomplete = () => resolve();
      t.onerror = () => reject(t.error || new Error('Skrivningen misslyckades'));
      t.onabort = () => reject(t.error || new Error('Skrivningen avbröts. Lagringen kan vara full.'));
    });
  },
  /* Ersätter allt i en enda transaktion. Misslyckas den lämnas gamla data orörda. */
  replaceAll(data) {
    if (Store.volatile) return Promise.resolve();
    return new Promise((resolve, reject) => {
      let t;
      try {
        t = Store.db.transaction(STORES, 'readwrite');
        ['books', 'recipes', 'tags', 'photos'].forEach(n => { const os = t.objectStore(n); os.clear(); data[n].forEach(x => os.put(x)); });
        const m = t.objectStore('meta'); m.clear();
        data.meta.forEach(x => m.put(x));
      } catch (e) { try { t.abort(); } catch (_) { /* */ } return reject(e); }
      t.oncomplete = () => resolve();
      t.onerror = () => reject(t.error || new Error('Återställningen misslyckades'));
      t.onabort = () => reject(t.error || new Error('Återställningen avbröts'));
    });
  }
};

function toBlob(canvas, q) { return new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('Bilden kunde inte skapas.')), 'image/jpeg', q)); }
function readDataUrl(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error || new Error('Filen kunde inte läsas')); r.readAsDataURL(file); }); }
function decodeSrc(src) { const img = new Image(); img.src = src; return img.decode().then(() => img); }
/* Läser en bild utan blob-adresser, så den fungerar även där de är blockerade. */
async function loadImage(file) {
  if (window.createImageBitmap) {
    try { const bm = await createImageBitmap(file); return { img: bm, w: bm.width, h: bm.height, done() { try { bm.close(); } catch (e) { /* */ } } }; } catch (e) { /* prova nästa */ }
  }
  try { const img = await decodeSrc(await readDataUrl(file)); return { img, w: img.naturalWidth, h: img.naturalHeight, done() {} }; }
  catch (e) { throw new Error('Bilden kunde inte läsas. Prova en JPEG- eller PNG-bild.'); }
}
async function processImage(file, max, q) {
  const im = await loadImage(file);
  try {
    const sc = Math.min(1, max / Math.max(im.w, im.h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.w * sc)); c.height = Math.max(1, Math.round(im.h * sc));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im.img, 0, 0, c.width, c.height);
    return await toBlob(c, q);
  } finally { im.done(); }
}

  const label = r.name + (r.rating != null ? ', betyg ' + r.rating + ' av 5' : ', utan betyg') + (r.cooked ? ', lagad' : ', inte lagad') + (r.fav ? ', favorit' : '');
  return h('div', { class: 'tile', style: '--h:' + hueOf(r.bookId) },
    h('button', { type: 'button', class: 'topen', 'aria-label': label, onclick: () => openRecipe(r.id) },
      ph ? photoImg(ph, { class: 'ph', alt: '', loading: 'lazy' }) : h('span', { class: 'ph phold', 'aria-hidden': 'true' }, icon('utensils')),
      h('span', { class: 'tb' }, h('span', { class: 'tname' }, r.name), bookLine(r), h('span', { class: 'tfoot' }, ratingEl(r), h('span', { class: 'cook-sp', 'aria-hidden': 'true' })))),
    h('button', { type: 'button', class: 'fvbtn' + (r.fav ? ' on' : ''), 'aria-pressed': String(!!r.fav), 'aria-label': r.fav ? 'Ta bort ' + r.name + ' som favorit' : 'Favoritmarkera ' + r.name,
      onclick: () => toggleFav(r.id) }, icon('heart')),
    rateBtnEl(r, 'intile'),
    cookBtnEl(r, 'intile'));
}
/* Rad i en kokboks egen lista: sidnummer syns här eftersom man bläddrar i boken */
function bookRow(r) {
  return h('div', { class: 'li', style: '--h:' + hueOf(r.bookId) },
    h('button', { type: 'button', class: 'open', onclick: () => openRecipe(r.id), 'aria-label': 'Öppna ' + r.name },
      r.url ? h('span', { class: 'pg' }, icon('link')) : h('span', { class: 'pg' }, String(r.page)),
      h('span', { class: 'rname' }, r.name)),
    h('div', { class: 'side' },
      h('button', { type: 'button', class: 'favtap' + (r.fav ? ' on' : ''), 'aria-pressed': String(!!r.fav), 'aria-label': r.fav ? 'Ta bort ' + r.name + ' som favorit' : 'Favoritmarkera ' + r.name,
        onclick: e => { e.stopPropagation(); toggleFav(r.id); } }, icon('heart')),
      rateBtnEl(r), cookBtnEl(r)));
}

const toggleIn = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : arr.concat([v]);
/* Lagat/inte lagat ligger i vanliga filtret. Favoriter har en egen snabbknapp och räknas inte in i Filter-knappen. */
function activeFilterCount() { const f = S.f; return f.books.length + f.stars.length + f.tags.length + (f.cooked !== 'all' ? 1 : 0); }
function anyFilter() { return activeFilterCount() > 0 || S.f.fav || S.f.q.trim() !== ''; }
function clearAllFilters() { S.f = Core.emptyFilters(); if (R) R.search.value = ''; render(); }

function chipBtn(label, on, fn) { return h('button', { type: 'button', class: 'chip', 'aria-pressed': on ? 'true' : 'false', onclick: fn }, label); }
const STAR_LABEL = n => n === 0 ? 'Utan betyg' : n === 1 ? '1 stjärna' : n + ' stjärnor';

const SORTS = [['name', 'Namn A–Ö'], ['fav', 'Favoriter först'], ['new', 'Senast tillagda'], ['stars', 'Högsta betyg']];
/* Sortering är inget filter: egen knapp med en liten dialog */
function openSortDialog() {
  let sh;
  const opts = SORTS.map(([v, l]) => h('button', { type: 'button', class: 'chip sortopt', role: 'radio', 'aria-checked': String(S.sort === v), 'data-v': v,
    onclick: () => { S.sort = v; lsSet('rs.sort', v); sh.close(true); render(); } }, S.sort === v ? icon('check') : null, l));
  sh = openSheet({ title: 'Sortera', body: h('div', { class: 'stack', role: 'radiogroup', 'aria-label': 'Sortera' }, opts),
    footer: h('div', { class: 'sf' }, h('button', { type: 'button', class: 'btn grow', onclick: () => sh.close() }, 'Stäng')) });
  sh.el.style.maxWidth = '420px';
}
function closeFilter() { S.filterOpen = false; updateRecipes(); const t = document.querySelector('.tools'); if (t) t.scrollIntoView({ block: 'start' }); if (R && R.filterBtn) R.filterBtn.focus({ preventScroll: true }); }
function buildFilterPanel() {
  const f = S.f;
  const g = (title, ...kids) => h('div', { class: 'fgroup' }, h('div', { class: 'lab' }, title), ...kids);
  const set = (k, v) => { S.f[k] = v; render(); };
  return h('div', { class: 'fpanel', id: 'fpanel' },
    h('div', { class: 'fhead' }, h('strong', null, 'Filter')),
    g('Lagat', h('div', { class: 'chips' }, [['all', 'Alla'], ['notcooked', 'Inte lagat'], ['cooked', 'Lagat']].map(([v, l]) => chipBtn(l, f.cooked === v, () => set('cooked', v))))),
    g('Betyg', h('div', { class: 'chips' }, [5, 4, 3, 2, 1, 0].map(n => h('button', { type: 'button', class: 'chip starchip', 'aria-pressed': f.stars.includes(n) ? 'true' : 'false',
      'aria-label': STAR_LABEL(n), title: STAR_LABEL(n), onclick: () => set('stars', toggleIn(f.stars, n)) },
      n === 0 ? h('span', null, 'Utan betyg') : Array.from({ length: n }, () => icon('star')))))),
    g('Taggar',
      h('div', { class: 'chips' }, sortedTags().map(t => chipBtn(t.name, f.tags.includes(t.id), () => set('tags', toggleIn(f.tags, t.id))))),
      f.tags.length >= 2 ? h('div', { class: 'seg', role: 'group', 'aria-label': 'Taggkrav' },
        [['all', 'Alla valda taggar'], ['any', 'Minst en vald tagg']].map(([v, l]) => h('button', { type: 'button', 'aria-pressed': f.tagMode === v ? 'true' : 'false', onclick: () => set('tagMode', v) }, l))) : null),
    g('Kokbok', h('div', { class: 'chips' }, sortedBooks().map(b => chipBtn(b.name, f.books.includes(b.id), () => set('books', toggleIn(f.books, b.id)))))),
    h('button', { type: 'button', class: 'btn pri big fshow', id: 'fshow', onclick: closeFilter }, icon('check'), currentList().length ? 'Visa ' + plural(currentList().length, 'recept', 'recept') : 'Stäng filter'));
}
function activeChips() {
  const f = S.f, out = [];
  const chip = (label, rm) => h('span', { class: 'chip' }, label, h('button', { type: 'button', 'aria-label': 'Ta bort filter ' + label, onclick: rm }, icon('x')));
  if (f.q.trim()) out.push(chip('Sök: ' + f.q.trim(), () => { S.f.q = ''; R.search.value = ''; render(); }));
  if (f.fav) out.push(chip('Favoriter', () => { S.f.fav = false; render(); }));
  if (f.cooked !== 'all') out.push(chip(f.cooked === 'cooked' ? 'Lagat' : 'Inte lagat', () => { S.f.cooked = 'all'; render(); }));
  f.books.forEach(id => S.books[id] && out.push(chip('Kokbok: ' + S.books[id].name, () => { S.f.books = f.books.filter(x => x !== id); render(); })));
  f.stars.slice().sort().forEach(n => out.push(chip('Betyg: ' + STAR_LABEL(n), () => { S.f.stars = f.stars.filter(x => x !== n); render(); })));
  f.tags.forEach(id => S.tags[id] && out.push(chip('Tagg: ' + S.tags[id].name, () => { S.f.tags = f.tags.filter(x => x !== id); render(); })));
  if (f.tags.length >= 2) out.push(h('span', { class: 'count' }, f.tagMode === 'all' ? 'Alla valda taggar krävs' : 'Minst en av taggarna'));
  if (anyFilter() && out.length) out.push(h('button', { type: 'button', class: 'btn sm', onclick: clearAllFilters }, 'Rensa alla'));
  return out;
}
function currentList() {
  return Core.sortRecipes(Core.filterRecipes(Object.values(S.recipes), S.books, S.tags, S.f), S.sort, S.books);
}

function buildRecipesView(main) {
  const search = h('input', { class: 'inp', id: 'q', type: 'search', placeholder: 'Sök recept, bok, tagg eller kommentar', 'aria-label': 'Sök i hela samlingen', autocomplete: 'off', value: S.f.q,
    oninput: e => { S.f.q = e.target.value; updateRecipes(); } });
  const filterBtn = h('button', { type: 'button', class: 'btn', id: 'fbtn', 'aria-expanded': String(S.filterOpen), 'aria-controls': 'fpanel', onclick: () => { S.filterOpen = !S.filterOpen; updateRecipes(); } });
  const favBtn = h('button', { type: 'button', class: 'btn favq', id: 'favq', 'aria-pressed': 'false', onclick: () => { S.f.fav = !S.f.fav; render(); } }, icon('heart'), 'Favoriter');
  const panelHost = h('div'), activeHost = h('div', { class: 'active' }), countEl = h('div', { class: 'count grow', 'aria-live': 'polite' }), results = h('div');
  const sortBtn = h('button', { type: 'button', class: 'btn sortbtn', id: 'sortbtn', 'aria-label': 'Sortera', title: 'Sortera', onclick: openSortDialog }, icon('sort'));
  R = { search, favBtn, filterBtn, sortBtn, panelHost, activeHost, countEl, results };
  main.appendChild(h('div', { class: 'tools' },
    h('div', { class: 'searchbox' }, icon('search'), search),
    h('div', { class: 'toolrow' }, countEl, favBtn, filterBtn, sortBtn),
    panelHost, activeHost));
  main.appendChild(results);
}

function updateRecipes() {
  if (!R) return;
  const n = activeFilterCount();
  clear(R.filterBtn).append(icon(S.filterOpen ? 'x' : 'filter'), S.filterOpen ? 'Stäng filter' : 'Filter' + (n ? ' (' + n + ')' : ''));
  R.filterBtn.classList.toggle('pri', !!S.filterOpen);
  R.filterBtn.setAttribute('aria-expanded', String(S.filterOpen));
  R.favBtn.setAttribute('aria-pressed', String(!!S.f.fav));
  clear(R.panelHost); if (S.filterOpen) R.panelHost.appendChild(buildFilterPanel());
  clear(R.activeHost); activeChips().forEach(x => R.activeHost.appendChild(x));
  const all = Object.values(S.recipes);
  const list = currentList();
  R.countEl.textContent = all.length ? (list.length === all.length ? plural(all.length, 'recept', 'recept') : list.length + ' av ' + plural(all.length, 'recept', 'recept')) : '';
  clear(R.results);
  if (!all.length) {
    R.results.appendChild(h('div', { class: 'empty' }, h('strong', null, 'Här dyker dina recept upp'),
      h('span', null, 'Lägg in en kokbok i Bokhyllan, så kan du söka och välja middag härifrån.'),
      h('button', { type: 'button', class: 'btn pri', onclick: () => go('books') }, icon('book'), 'Gå till Bokhyllan')));
  } else if (!list.length) {
    R.results.appendChild(h('div', { class: 'empty' }, h('strong', null, 'Inga recept matchar'),
      h('span', null, 'Ändra sökningen eller ta bort något filter.'),
      h('button', { type: 'button', class: 'btn', onclick: clearAllFilters }, 'Rensa alla filter')));
  } else {
    R.results.appendChild(h('div', { class: 'tiles' }, list.map(recipeTile)));
  }
}

/* ===== Receptdetalj, tillägg och taggar ===== */
function secEl(title, ...kids) { return h('section', { class: 'sec' }, title ? h('h3', null, title) : null, ...kids); }
function fieldEl(label, id, input, extra) { return h('div', { class: 'field' }, h('label', { for: id }, label), input, extra || null); }

function openRecipe(id) {
  if (!S.recipes[id]) return;
  const cur = () => S.recipes[id];
  const web = cur().bookId === WEB;
  const commits = [];
  let sh;
  const whereHost = h('div');
  const upd = async patch => { const ok = await updateRecipe(id, patch); paintWhere(); return ok; };
  function paintWhere() {
    const r = cur();
    clear(whereHost);
    if (r.bookId === WEB || r.url) {
      whereHost.className = 'where';
      whereHost.append(h('div', { class: 'grow' }, h('div', { class: 'wb' }, Core.siteOf(r.url || '') || 'Webbrecept'), h('div', { class: 'muted small' }, 'Webbrecept')),
        r.url ? h('a', { class: 'btn pri', href: r.url, target: '_blank', rel: 'noopener noreferrer' }, icon('link'), 'Öppna recept') : null);
    } else { whereHost.className = ''; whereHost.hidden = true; return; }
    whereHost.hidden = false;
  }
  const titleBig = h('h1', { class: 'rtitle' }, cur().name);

  /* Namn */
  const nameErr = h('div', { class: 'err', role: 'alert' });
  const nameInp = h('input', { class: 'inp', id: 'd-name', value: cur().name });
  const commitName = async () => {
    const v = nameInp.value.trim();
    if (v === cur().name) return;
    if (!v) { nameErr.textContent = 'Receptet måste ha ett namn.'; nameInp.classList.add('bad'); nameInp.value = cur().name; return; }
    nameErr.textContent = ''; nameInp.classList.remove('bad');
    if (await upd({ name: v })) { titleBig.textContent = v; toast('Namnet sparades.'); } else nameInp.value = cur().name;
  };
  nameInp.addEventListener('change', commitName); commits.push(commitName);

  /* Plats */
  let locSec;
  if (!web) {
    const pageErr = h('div', { class: 'err', role: 'alert' });
    const bookSel = h('select', { class: 'inp', id: 'd-book' }, sortedBooks().filter(b => b.id !== WEB).map(b => h('option', { value: b.id, selected: b.id === cur().bookId }, b.name)));
    bookSel.addEventListener('change', async () => { if (!(await upd({ bookId: bookSel.value }))) bookSel.value = cur().bookId; else toast('Kokboken ändrades.'); });
    const pageInp = h('input', { class: 'inp', id: 'd-page', inputmode: 'numeric', autocomplete: 'off', value: cur().page });
    const commitPage = async () => {
      const v = pageInp.value.trim();
      if (v === String(cur().page)) return;
      if (!v) { pageErr.textContent = 'Sidnummer krävs för bokrecept.'; pageInp.classList.add('bad'); pageInp.value = cur().page; return; }
      pageErr.textContent = ''; pageInp.classList.remove('bad');
      if (await upd({ page: v })) toast('Sidnumret sparades.'); else pageInp.value = cur().page;
    };
    pageInp.addEventListener('change', commitPage); commits.push(commitPage);
    locSec = secEl('Kokbok och sida', h('div', { class: 'row', style: 'align-items:flex-start' },
      h('div', { class: 'grow' }, fieldEl('Kokbok', 'd-book', bookSel)),
      h('div', { style: 'width:110px' }, fieldEl('Sidnummer', 'd-page', pageInp, pageErr))));
  } else {
    const urlErr = h('div', { class: 'err', role: 'alert' });
    const openA = h('a', { class: 'btn pri', href: cur().url || '#', target: '_blank', rel: 'noopener noreferrer' }, icon('link'), 'Öppna originalrecept');
    const urlInp = h('input', { class: 'inp', id: 'd-url', type: 'url', inputmode: 'url', autocomplete: 'off', value: cur().url || '' });
    const commitUrl = async () => {
      const v = Core.cleanUrl(urlInp.value);
      if (urlInp.value.trim() === (cur().url || '')) return;
      if (!v) { urlErr.textContent = 'Länken är inte giltig. Den ska börja med http:// eller https://.'; urlInp.classList.add('bad'); urlInp.value = cur().url || ''; return; }
      urlErr.textContent = ''; urlInp.classList.remove('bad');
      if (await upd({ url: v })) { urlInp.value = v; openA.href = v; toast('Länken sparades.'); } else urlInp.value = cur().url || '';
    };
    urlInp.addEventListener('change', commitUrl); commits.push(commitUrl);
    locSec = secEl('Ändra länk', h('div', { class: 'row' }, openA, h('span', { class: 'muted small' }, Core.siteOf(cur().url || ''))),
      fieldEl('Länk', 'd-url', urlInp, urlErr), h('div', { class: 'muted small' }, 'Sparas i boken Webbrecept.'));
  }

  /* Lagad och betyg */
  const cookBtn = h('button', { type: 'button', class: 'btn cookbtn', onclick: async () => { await upd({ cooked: !cur().cooked }); paintStatus(); } });
  const favBtn = h('button', { type: 'button', class: 'btn heartbtn', id: 'd-fav', onclick: async () => { await upd({ fav: !cur().fav }); paintStatus(); } });
  const rateLab = h('div', { class: 'muted', 'aria-live': 'polite' });
  const starBtns = [1, 2, 3, 4, 5].map(n => h('button', { type: 'button', class: 's', 'aria-label': STAR_LABEL(n), title: STAR_LABEL(n),
    onclick: async () => { await upd({ rating: n }); paintStatus(); } }, icon('star')));
  const noRate = h('button', { type: 'button', class: 'btn sm', onclick: async () => { await upd({ rating: null }); paintStatus(); } }, 'Ta bort betyg');
  function paintStatus() {
    const r = cur();
    clear(cookBtn).append(icon('check'), r.cooked ? 'Lagad' : 'Inte lagad');
    cookBtn.setAttribute('aria-pressed', String(r.cooked));
    clear(favBtn).append(icon('heart'), 'Favorit');
    favBtn.setAttribute('aria-pressed', String(!!r.fav));
    starBtns.forEach((b, i) => { b.classList.toggle('on', r.rating != null && i < r.rating); b.setAttribute('aria-pressed', String(r.rating === i + 1)); });
    rateLab.textContent = r.rating == null ? 'Utan betyg' : r.rating + ' av 5';
    noRate.hidden = r.rating == null;
  }

  /* Taggar */
  const tagHost = h('div', { class: 'chips' });
  const newTag = h('input', { class: 'inp', id: 'd-newtag', placeholder: 'Ny tagg', autocomplete: 'off', style: 'flex:1;min-width:120px' });
  function paintTags() {
    clear(tagHost);
    sortedTags().forEach(t => {
      const on = (cur().tagIds || []).includes(t.id);
      tagHost.appendChild(chipBtn(t.name, on, async () => {
        const ids = on ? cur().tagIds.filter(x => x !== t.id) : (cur().tagIds || []).concat([t.id]);
        await upd({ tagIds: ids }); paintTags();
      }));
    });
    if (!tagHost.firstChild) tagHost.appendChild(h('span', { class: 'muted' }, 'Inga taggar än.'));
  }
  const addTagNow = async () => {
    const v = newTag.value.trim(); if (!v) return;
    const t = await addTag(v); if (!t) return;
    if (!(cur().tagIds || []).includes(t.id)) await upd({ tagIds: (cur().tagIds || []).concat([t.id]) });
    newTag.value = ''; paintTags();
  };
  newTag.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTagNow(); } });

  /* Kommentar */
  const comm = h('textarea', { class: 'inp', id: 'd-comment', rows: 3, placeholder: 'Till exempel: halvera sockret, passar 6 personer', value: cur().comment || '' });
  const delComm = h('button', { type: 'button', class: 'btn sm', onclick: async () => { comm.value = ''; if (await upd({ comment: '' })) toast('Kommentaren togs bort.'); paintComm(); } }, 'Ta bort kommentar');
  const paintComm = () => { delComm.hidden = !(cur().comment || '').length; };
  const commitComm = async () => {
    if (comm.value === (cur().comment || '')) return;
    if (await upd({ comment: comm.value })) toast('Kommentaren sparades.'); else comm.value = cur().comment || '';
    paintComm();
  };
  comm.addEventListener('change', commitComm); commits.push(commitComm);

  /* Foto: läggs till direkt, utan förhandsgranskning eller godkännande */
  const photoHost = h('div', { class: 'photo' });
  const pickPhoto = async files => {
    try {
      const blob = await processImage(files[0], 1600, 0.82);
      if (await setRecipePhoto(id, blob)) { toast('Fotot lades till.'); paintPhoto(); }
    } catch (e) { fail('Fotot kunde inte läggas till.', e); }
  };
  function paintPhoto() {
    clear(photoHost);
    const p = cur().photoId && S.photos[cur().photoId];
    if (p) photoHost.append(photoImg(p, { alt: 'Eget foto av ' + cur().name }));
    photoHost.append(h('div', { class: 'row' },
      fileButton('Ta foto', 'camera', { capture: 'environment' }, pickPhoto),
      fileButton(p ? 'Byt foto' : 'Välj foto', 'image', {}, pickPhoto),
      p ? h('button', { type: 'button', class: 'btn danger', onclick: async () => { if (await removeRecipePhoto(id)) { toast('Fotot togs bort.'); paintPhoto(); } } }, icon('trash'), 'Ta bort foto') : null));
    if (!p) photoHost.prepend(h('div', { class: 'phold big', role: 'img', 'aria-label': 'Ingen bild än' }, icon('utensils'), h('span', null, 'Ingen bild än')));
  }

  const del = h('button', { type: 'button', class: 'btn danger', onclick: async () => {
    const ok = await confirmDialog({ title: 'Ta bort receptet?', danger: true, confirmLabel: 'Ta bort',
      body: [h('p', null, '”' + cur().name + '” tas bort tillsammans med betyg, kommentar och foto.'), h('p', { class: 'muted small' }, 'Det går inte att ångra.')] });
    if (ok && await deleteRecipe(id)) { sh.close(true); toast('Receptet togs bort.'); }
  } }, icon('trash'), 'Ta bort recept');

  const body = h('div', { class: 'stack' },
    titleBig,
    whereHost,
    secEl('Namn', fieldEl('Receptnamn', 'd-name', nameInp, nameErr)),
    locSec,
    secEl('Foto', photoHost),
    h('div', { class: 'sec cmp' }, h('div', { class: 'row tog2' }, cookBtn, favBtn),
      h('div', { class: 'rline' }, h('div', { class: 'rate', role: 'group', 'aria-label': 'Betyg' }, starBtns), rateLab, noRate)),
    secEl('Taggar', tagHost, h('div', { class: 'row' }, newTag, h('button', { type: 'button', class: 'btn', onclick: addTagNow }, icon('plus'), 'Lägg till'))),
    secEl('Kommentar', comm, delComm),
    h('div', null, del));
  paintWhere(); paintStatus(); paintTags(); paintComm(); paintPhoto();
  sh = openSheet({ title: 'Recept', body, onClose: () => { commits.forEach(f => f()); return true; } });
}

/* ===== Valfria uppgifter när man lägger till ett recept: lagad, favorit, betyg, taggar, foto ===== */
function extrasForm() {
  const st = { cooked: false, fav: false, rating: null, tagIds: [], blob: null, prev: '' };
  const cookB = h('button', { type: 'button', class: 'btn tog', id: 'x-cooked' }), favB = h('button', { type: 'button', class: 'btn tog', id: 'x-fav' });
  cookB.onclick = () => { st.cooked = !st.cooked; paint(); }; favB.onclick = () => { st.fav = !st.fav; paint(); };
  const stars = [1, 2, 3, 4, 5].map(n => h('button', { type: 'button', class: 's', 'aria-label': STAR_LABEL(n), title: STAR_LABEL(n),
    onclick: () => { st.rating = st.rating === n ? null : n; paint(); } }, icon('star')));
  const tagHost = h('div', { class: 'chips' });
  const newTag = h('input', { class: 'inp', id: 'x-newtag', placeholder: 'Ny tagg', autocomplete: 'off', style: 'flex:1;min-width:120px' });
  const addTagNow = async () => {
    const v = newTag.value.trim(); if (!v) return;
    const t = await addTag(v); if (!t) return;
    if (!st.tagIds.includes(t.id)) st.tagIds.push(t.id);
    newTag.value = ''; paint();
  };
  newTag.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTagNow(); } });
  const photoHost = h('div', { class: 'photo' });
  const pick = async files => {
    try {
      st.blob = await processImage(files[0], 1600, 0.82);
      st.prev = await readDataUrl(st.blob); paint();
    } catch (e) { toast('Fotot kunde inte läggas till.', { bad: true }); }
  };
  function paint() {
    clear(cookB).append(icon('check'), st.cooked ? 'Lagad' : 'Inte lagad'); cookB.setAttribute('aria-pressed', String(st.cooked));
    clear(favB).append(icon('heart'), 'Favorit'); favB.setAttribute('aria-pressed', String(st.fav));
    stars.forEach((b, i) => { b.classList.toggle('on', st.rating != null && i < st.rating); b.setAttribute('aria-pressed', String(st.rating === i + 1)); });
    clear(tagHost);
    sortedTags().forEach(t => tagHost.appendChild(chipBtn(t.name, st.tagIds.includes(t.id), () => {

/* ===== Lägg till webbrecept ===== */
async function suggestTitle(url) {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
    const res = await fetch(url, { signal: ctl.signal, mode: 'cors', credentials: 'omit' }); clearTimeout(t);
    if (!res.ok) throw new Error('status ' + res.status);
    const title = Core.titleFromHtml((await res.text()).slice(0, 400000));
    if (title) return { title, from: 'page' };
  } catch (e) { /* de flesta sidor tillåter inte läsning från en annan webbplats */ }
  return { title: Core.nameFromUrl(url), from: 'url' };
}
function openAddWeb() {
  const url = h('input', { class: 'inp', id: 'w-url', type: 'url', inputmode: 'url', autocomplete: 'off', placeholder: 'Klistra in länk' });
  const name = h('input', { class: 'inp', id: 'w-name', autocomplete: 'off', placeholder: 'Receptnamn' });
  const urlErr = h('div', { class: 'err', role: 'alert' }), nameErr = h('div', { class: 'err', role: 'alert' });
  const info = h('div', { class: 'muted small', 'aria-live': 'polite' }), warn = h('div', { class: 'note warn', hidden: true });
  const X = extrasForm();
  let dirty = false, ack = false, token = 0, lastUrl = '';
  name.addEventListener('input', () => { dirty = true; });
  const saveBtn = h('button', { type: 'button', class: 'btn pri' }, 'Spara');
  async function check() {
    const u = Core.cleanUrl(url.value);
    ack = false; saveBtn.textContent = 'Spara'; warn.hidden = true; urlErr.textContent = ''; url.classList.remove('bad');
    if (!u) { if (url.value.trim()) { urlErr.textContent = 'Länken är inte giltig.'; url.classList.add('bad'); } return null; }
    const norm = Core.normalizeUrl(u);
    const same = Object.values(S.recipes).filter(r => r.url && Core.normalizeUrl(r.url) === norm);
    if (same.length) {
      clear(warn).append(icon('warn'), h('span', null, 'Länken finns redan: ', same.map(r => '”' + r.name + '”').join(', '), '. '),
        h('button', { type: 'button', class: 'btn sm', onclick: () => { sh.close(true); openRecipe(same[0].id); } }, 'Öppna'));
      warn.hidden = false;
    }
    if (u !== lastUrl) {
      lastUrl = u; const my = ++token; info.textContent = 'Hämtar namn…';
      const s = await suggestTitle(u);
      if (my !== token) return u;
      if (s.title && !dirty) name.value = s.title;
      info.textContent = s.from === 'page' ? 'Namnet hämtades från sidan. Ändra det vid behov.'
        : s.title ? 'Sidan kunde inte läsas automatiskt. Namnet är ett förslag från länken. Ändra det vid behov.'
        : 'Sidan kunde inte läsas automatiskt. Skriv namnet själv.';
    }
    return u;
  }
  url.addEventListener('change', check);
  url.addEventListener('paste', () => setTimeout(check, 0));
  saveBtn.onclick = async () => {
    nameErr.textContent = ''; name.classList.remove('bad');
    const u = await check();
    if (!u) { if (!url.value.trim()) { urlErr.textContent = 'Klistra in en länk.'; url.classList.add('bad'); } url.focus(); return; }
    if (!name.value.trim()) { nameErr.textContent = 'Skriv ett receptnamn.'; name.classList.add('bad'); name.focus(); return; }
    if (!warn.hidden && !ack) { ack = true; saveBtn.textContent = 'Spara ändå'; return; }
    const rs = await addRecipes([Object.assign({ bookId: WEB, name: name.value, url: u }, X.fields())]);
    if (!rs) return;
    await X.after(rs[0]);
    render(); sh.close(true);
    toast('Webbrecept sparat i boken Webbrecept.', { action: { label: 'Öppna', run: () => openRecipe(rs[0].id) } });
  };
  const sh = openSheet({ title: 'Lägg till webbrecept',
    body: h('div', { class: 'stack' }, fieldEl('Länk', 'w-url', url, urlErr), warn, fieldEl('Receptnamn', 'w-name', name, nameErr), info,
      h('div', { class: 'muted small' }, 'Webbrecept samlas i boken Webbrecept och behöver inget sidnummer.'), X.el),
    footer: h('div', { class: 'sf' }, h('button', { type: 'button', class: 'btn grow', onclick: () => sh.close() }, 'Stäng'), saveBtn) });
  url.focus();
}

/* ===== Säkerhetskopia och återställning ===== */
function blobToDataUrl(blob) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error || new Error('Ett foto kunde inte läsas.')); fr.readAsDataURL(blob); });
}
function dataUrlToBlob(u) {
  const i = u.indexOf(','), head = u.slice(0, i), type = (head.match(/^data:([^;,]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(u.slice(i + 1)), a = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k);
  return new Blob([a], { type });
}
async function buildBackup() {
  const photos = [];
  for (const p of Object.values(S.photos)) photos.push({ id: p.id, type: p.type, data: await blobToDataUrl(p.blob) });
  return { app: 'receptsamlingen', schema: Core.SCHEMA, exportedAt: new Date().toISOString(),
    books: Object.values(S.books), recipes: Object.values(S.recipes), tags: Object.values(S.tags), photos };
}
const sizeText = n => n > 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' kB';

function backupName() { const d = new Date(), pad = n => String(n).padStart(2, '0'); return 'receptsamlingen-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json'; }
function plainDownload(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
const canShareFile = () => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; } };
async function markExported() {
  const v = new Date().toISOString();
  S.meta.lastExport = v; Store.commit([{ s: 'meta', put: { key: 'lastExport', value: v } }]).catch(() => {});
  paintBackupDot();
}
async function exportBackup(statusEl) {
  const dl = STANDALONE ? null : await (window.claude && window.claude.use ? window.claude.use('downloads').catch(() => null) : null);
  if (!dl && !STANDALONE) { statusEl.textContent = 'Filnedladdning är inte tillgänglig i den här vyn, så säkerhetskopian kan inte sparas här. Öppna appen i en vanlig webbläsarflik eller i Claude-appen och försök igen.'; statusEl.className = 'err'; return; }
  statusEl.className = 'muted small'; statusEl.textContent = 'Förbereder säkerhetskopian…';
  let blob;
  try { blob = new Blob([JSON.stringify(await buildBackup())], { type: 'application/json' }); }
  catch (e) { statusEl.className = 'err'; statusEl.textContent = 'Säkerhetskopian kunde inte skapas. ' + (e && e.message || ''); return; }
  const name = backupName();
  try {
    if (STANDALONE) plainDownload(blob, name); else await dl.save({ filename: name, data: blob });
    await markExported();
    statusEl.className = 'muted small'; statusEl.textContent = 'Säkerhetskopian (' + sizeText(blob.size) + ') skickades till nedladdning' + (STANDALONE ? '. Hitta filen i Filer-appen under Hämtade filer och spara gärna en kopia i Google Drive.' : '. Kontrollera att filen finns där du sparade den.');
    toast('Säkerhetskopian är klar.');
  } catch (e) {
    statusEl.className = e && e.code === 'declined' ? 'muted small' : 'err';
    statusEl.textContent = e && e.code === 'declined' ? 'Du avbröt. Ingen fil sparades.' : e && e.code === 'too_large' ? 'Filen är för stor för att sparas här.' : 'Filen kunde inte sparas' + (e && e.code ? ' (' + e.code + ')' : '') + '.';
  }
}
/* Delningsmenyn i Android: skicka filen direkt till Google Drive, e-post eller annan telefon. */
async function shareBackup(statusEl) {
  try {
    const blob = new Blob([JSON.stringify(await buildBackup())], { type: 'application/json' });
    const file = new File([blob], backupName(), { type: 'application/json' });
    await navigator.share({ files: [file], title: 'Receptsamlingen, säkerhetskopia' });
    await markExported();
    statusEl.className = 'muted small'; statusEl.textContent = 'Delad. Kontrollera att filen kom fram dit du skickade den.';
  } catch (e) {
    if (e && e.name === 'AbortError') { statusEl.className = 'muted small'; statusEl.textContent = 'Du avbröt. Ingen fil skickades.'; return; }
    statusEl.className = 'err'; statusEl.textContent = 'Det gick inte att dela filen. Använd Exportera i stället.';
  }
}
/* Liten prick på ⋯ när säkerhetskopian är gammal, utan varningsruta. */
function paintBackupDot() {
  const b = document.querySelector('.hero .more'); if (!b) return;
  const n = Object.keys(S.recipes).length;
  const old = !S.meta.lastExport || (Date.now() - new Date(S.meta.lastExport).getTime()) > 30 * 86400000;
  b.classList.toggle('dot', STANDALONE && n >= 3 && old);
}

async function restoreFromFile(file, onDone) {
  let data;
  try {
    const text = await file.text();
    let o; try { o = JSON.parse(text); } catch (e) { throw new Error('Filen är ingen giltig säkerhetskopia (kunde inte läsas som JSON).'); }
    Core.validateBackup(o);
    const photos = o.photos.map(p => { let b; try { b = dataUrlToBlob(p.data); } catch (e) { throw new Error('Ett foto i filen är skadat.'); } return { id: p.id, blob: b, type: b.type, createdAt: Number(p.createdAt) || Date.now() }; });
    data = {
      books: o.books.map(b => Object.assign({ id: b.id, name: String(b.name).trim(), author: typeof b.author === 'string' ? b.author : '', kind: b.id === WEB ? 'web' : 'book', createdAt: Number(b.createdAt) || 0 }, typeof b.coverId === 'string' && b.coverId ? { coverId: b.coverId } : {})),
      recipes: o.recipes.map(Core.cleanRecipe),
      tags: o.tags.map(t => ({ id: t.id, name: String(t.name).trim(), createdAt: Number(t.createdAt) || 0 })),
      photos, meta: [{ key: 'seeded', value: 1 }].concat(o.exportedAt ? [{ key: 'lastExport', value: o.exportedAt }] : [])
    };
  } catch (e) {
    await confirmDialog({ title: 'Filen kunde inte återställas', cancelLabel: 'Stäng', confirmLabel: 'OK', body: [h('p', null, e.message || 'Okänt fel.'), h('p', { class: 'muted small' }, 'Dina nuvarande recept är oförändrade.')] });
    return;
  }
  const mine = { n: Object.keys(S.recipes).length, b: Object.keys(S.books).length - 1, p: Object.keys(S.photos).length };
  const ok = await confirmDialog({ title: 'Ersätta hela samlingen?', danger: true, confirmLabel: 'Ersätt med filens innehåll',
    body: [h('p', null, 'Filen innehåller ', h('strong', null, plural(data.recipes.length, 'recept', 'recept')), ', ' + plural(data.books.length - 1, 'kokbok', 'kokböcker') + ', ' + plural(data.tags.length, 'tagg', 'taggar') + ' och ' + plural(data.photos.length, 'foto', 'foton') + '.'),
      h('p', null, 'Din nuvarande samling (' + plural(mine.n, 'recept', 'recept') + ', ' + plural(mine.b, 'kokbok', 'kokböcker') + ', ' + plural(mine.p, 'foto', 'foton') + ') ersätts helt.'),
      h('p', { class: 'muted small' }, 'Om återställningen misslyckas lämnas din nuvarande samling orörd. Exportera gärna en säkerhetskopia först.')] });
  if (!ok) return;
  try { await Store.replaceAll(data); }
  catch (e) { fail('Återställningen misslyckades. Din nuvarande samling är oförändrad.', e); return; }
  fillState(data);
  S.f = Core.emptyFilters(); S.bookId = null;
  render(); onDone && onDone(); paintBackupDot();
  toast('Samlingen återställdes.');
}

        h('div', null, counts, last, store),
        h('p', { class: 'muted small', style: 'margin:0' }, (STANDALONE ? 'Samlingen ligger bara i den här telefonens webbläsare. Spara en säkerhetskopia regelbundet, och alltid innan du byter telefon eller rensar webbläsarens data.' : 'Samlingen ligger i den här webbläsaren, med en kopia i ditt Claude-konto. Använd en telefon åt gången.') + ' En fil med allt, inklusive foton, kan du spara som reserv eller använda för att flytta samlingen.'),
        h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn pri', onclick: () => exportBackup(statusEl) }, icon('save'), 'Exportera säkerhetskopia')), statusEl,
        h('hr', { style: 'border:0;border-top:1px solid var(--line);width:100%;margin:4px 0' }),

/* ===== Kopia i Claude-kontot (db-kapaciteten). Lokal lagring är kvar som arbetskopia. ===== */
const CLOUD_COLS = ['books', 'recipes', 'tags', 'photos'];
const Cloud = {
  db: null, state: 'av', last: null, err: '', chain: Promise.resolve(), warned: false,
  async init() {
    try { Cloud.db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { Cloud.db = null; }
    Cloud.state = Cloud.db ? 'ok' : 'av';
  },
  col(n) { return Cloud.db.collection(n); },
  async photoDoc(p) {
    // Molnkopian görs mindre så den ryms i en post (högst 256 KiB). Originalet i telefonen rörs inte.
    let url = '', max = 1100, q = 0.72;
    for (let i = 0; i < 4; i++) {
      const b = await processImage(p.blob, max, q);
      url = await blobToDataUrl(b);
      if (url.length < 230000) break;
      max = Math.round(max * 0.75); q = Math.max(0.5, q - 0.08);
    }
    if (url.length >= 250000) throw new Error('Fotot är för stort för kontot');
    return { id: p.id, type: 'image/jpeg', createdAt: p.createdAt || 0, data: url };
  },
  async setRec(n, rec) {
    const doc = n === 'photos' ? await Cloud.photoDoc(rec) : JSON.parse(JSON.stringify(rec));
    await Cloud.retry(() => Cloud.col(n).doc(rec.id).set(doc));
  },
  async retry(fn) {
    try { return await fn(); }
    catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); } throw e; }
  },
  /* Köar ändringar i ordning. Misslyckas något markeras kopian som ofullständig och synkas om vid nästa start. */
  mirror(ops) {
    if (!Cloud.db) return;
    const list = ops.filter(o => CLOUD_COLS.includes(o.s));
    if (!list.length) return;
    Cloud.state = 'sparar';
    Cloud.chain = Cloud.chain.then(async () => {
      try {
        for (const o of list) {
          if (o.put) await Cloud.setRec(o.s, o.put);
          else await Cloud.retry(() => Cloud.col(o.s).doc(o.del).delete());
        }
        Cloud.state = 'ok'; Cloud.last = new Date(); Cloud.err = '';
      } catch (e) {
        Cloud.state = 'fel'; Cloud.err = (e && (e.code || e.message)) || 'okänt fel';
        Store.commit([{ s: 'meta', put: { key: 'cloudDirty', value: 1 } }]).catch(() => {});
        if (!Cloud.warned) { Cloud.warned = true; toast('Kopian i kontot kunde inte uppdateras. Din samling är sparad i telefonen.', { bad: true }); }
      }
    });
  },
  async readAll() {
    const out = {};
    for (const n of CLOUD_COLS) {
      const snap = await Cloud.retry(() => Cloud.col(n).get());
      out[n] = snap.docs.map(d => d.data());
    }
    return out;
  },
  /* Vid start: tom telefon hämtar från kontot. Annars skickas det som saknas eller skiljer sig upp. */
  async sync() {
    if (!Cloud.db) return { did: 'none' };
    Cloud.state = 'sparar';
    try {
      const cloud = await Cloud.readAll();
      const localRecipes = Object.keys(S.recipes).length, localBooks = Object.keys(S.books).filter(id => id !== WEB).length;
      if (!localRecipes && !localBooks && (cloud.recipes.length || cloud.books.some(b => b.id !== WEB))) {
        const photos = cloud.photos.map(p => { const b = dataUrlToBlob(p.data); return { id: p.id, blob: b, type: b.type, createdAt: Number(p.createdAt) || 0 }; });
        const data = { books: cloud.books, recipes: cloud.recipes.map(Core.cleanRecipe), tags: cloud.tags, photos, meta: [{ key: 'seeded', value: 1 }] };
        if (!data.books.some(b => b.id === WEB)) data.books.push(Object.assign({}, S.books[WEB]));
        await Store.replaceAll(data);
        fillState(data);
        Cloud.state = 'ok'; Cloud.last = new Date();
        return { did: 'pull', n: data.recipes.length };
      }
      const byId = {}; CLOUD_COLS.forEach(n => { byId[n] = new Map(cloud[n].map(x => [x.id, x])); });
      let pushed = 0;
      const mine = { books: Object.values(S.books), recipes: Object.values(S.recipes), tags: Object.values(S.tags) };
      for (const n of ['books', 'recipes', 'tags']) {
        for (const r of mine[n]) {
          const c = byId[n].get(r.id);
          if (!c || JSON.stringify(sortKeys(c)) !== JSON.stringify(sortKeys(JSON.parse(JSON.stringify(r))))) { await Cloud.setRec(n, r); pushed++; }
        }
      }
      const d = await Store.loadAll();
      for (const p of d.photos) if (p.blob && !byId.photos.has(p.id)) { await Cloud.setRec('photos', p); pushed++; }
      Cloud.state = 'ok'; Cloud.last = new Date(); Cloud.err = '';
      Store.commit([{ s: 'meta', del: 'cloudDirty' }]).catch(() => {});
      return { did: 'push', n: pushed };
    } catch (e) {
      Cloud.state = 'fel'; Cloud.err = (e && (e.code || e.message)) || 'okänt fel';
      return { did: 'error' };
    }
  },
  /* Efter återställning från fil: kontot ska spegla filen. */
  async replace(data) {
    if (!Cloud.db) return;
    Cloud.chain = Cloud.chain.then(async () => {
      try {
        const cloud = await Cloud.readAll();
        const keep = { books: new Set(data.books.map(x => x.id)), recipes: new Set(data.recipes.map(x => x.id)), tags: new Set(data.tags.map(x => x.id)), photos: new Set(data.photos.map(x => x.id)) };
        for (const n of CLOUD_COLS) for (const c of cloud[n]) if (!keep[n].has(c.id)) await Cloud.retry(() => Cloud.col(n).doc(c.id).delete());
        for (const n of CLOUD_COLS) for (const r of data[n]) await Cloud.setRec(n, r);
        Cloud.state = 'ok'; Cloud.last = new Date();
      } catch (e) { Cloud.state = 'fel'; Cloud.err = (e && (e.code || e.message)) || 'okänt fel'; toast('Kopian i kontot kunde inte uppdateras efter återställningen.', { bad: true }); }
    });
  },
  text() {
    if (!Cloud.db) return 'Kopia i kontot är inte tillgänglig här. Öppna appen i Claude för att slå på den.';
    if (Cloud.state === 'fel') return 'Kopian i kontot är ofullständig (' + Cloud.err + '). Din samling finns kvar i telefonen. Tryck Synka nu.';
    if (Cloud.state === 'sparar') return 'Sparar kopia i kontot…';
    return 'Kopia i kontot är aktuell' + (Cloud.last ? ' (kontrollerad ' + Cloud.last.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }) + ')' : '') + '.';
  }
};
function sortKeys(o) { return Array.isArray(o) ? o.map(sortKeys) : o && typeof o === 'object' ? Object.keys(o).sort().reduce((a, k) => (a[k] = sortKeys(o[k]), a), {}) : o; }

/* Koppla in speglingen i lagret: bara efter lyckad lokal skrivning. */
(function () {
  const c0 = Store.commit.bind(Store), r0 = Store.replaceAll.bind(Store);
  Store.commit = ops => c0(ops).then(v => { Cloud.mirror(ops); return v; });
  Store.replaceAll = data => r0(data).then(v => { Cloud.replace(data); return v; });
})();

/* ===== Start och vyer ===== */
let mountKey = null;
const scrollMem = {}; let lastKey = null;
function render() {
  const key = S.view === 'recipes' ? 'recipes' : (S.bookId ? 'book:' + S.bookId : 'books');
  const moved = lastKey !== null && lastKey !== key;
  if (moved) scrollMem[lastKey] = window.scrollY;
  lastKey = key;
  [...document.querySelectorAll('.tab')].forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === S.view)));
  paintHero();
  const main = $('#main');
  if (S.view === 'recipes') {
    if (mountKey !== 'recipes') { clear(main); BD = null; buildRecipesView(main); mountKey = 'recipes'; }
    updateRecipes();
  } else if (S.bookId) {
    if (mountKey === key && BD && BD.id === S.bookId) BD.update();
    else { clear(main); R = null; buildBookDetail(main); mountKey = S.bookId ? key : 'books'; }
  } else if (mountKey === 'books') { clear(main); R = null; BD = null; buildBooks(main); }
  else { clear(main); R = null; BD = null; buildBooks(main); mountKey = 'books'; }
  if (moved) window.scrollTo(0, key.startsWith('book:') ? 0 : (scrollMem[key] || 0));
}
function go(view) { S.view = view; if (view === 'books') S.bookId = null; render(); }

function paintHero() {
  const hero = $('#hero'), sub = $('#herosub'); if (!hero || !sub) return;
  hero.classList.toggle('slim', S.view === 'books' && !!S.bookId);
  const rs = Object.values(S.recipes), nb = Math.max(0, Object.keys(S.books).length - 1), cooked = rs.filter(r => r.cooked).length;
  sub.textContent = !rs.length ? 'Samla recepten från dina kokböcker och från webben på ett ställe.'
    : plural(rs.length, 'recept', 'recept') + (nb ? ' i ' + plural(nb, 'kokbok', 'kokböcker') : '') + '. ' + (cooked ? (cooked === 1 ? 'Ett har du lagat.' : cooked + ' har du lagat.') : 'Inget lagat än.');
}

/* Ikon och namn när sidan läggs på telefonens hemskärm. Görs i efterhand eftersom sidans head styrs av värden. */
/* Enfilsversionen: manifest och ikoner läggs in från sidan själv, så bara index.html behöver laddas upp. */
function installInlineManifest() {
  const I = window.__ICONS__; if (!I) return;
  try {
    const add = (tag, attrs) => { const el = document.createElement(tag); for (const k in attrs) el.setAttribute(k, attrs[k]); document.head.appendChild(el); };
    const man = { name: 'Receptsamlingen', short_name: 'Recept', lang: 'sv', id: location.pathname, start_url: location.href.split('#')[0], scope: location.href.split('#')[0].replace(/[^/]*$/, ''),
      display: 'standalone', orientation: 'portrait', background_color: '#173A2A', theme_color: '#173A2A',
      icons: [{ src: I.i192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: I.i512, sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: I.mask, sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
    add('link', { rel: 'manifest', href: 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(man)) });
  } catch (e) { /* valfritt */ }
}
function installHomeIcon() {
  if (STANDALONE) { installInlineManifest(); return; } // den fristående appen har riktig manifest och ikon i sidhuvudet
  try {
    const N = 512, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const x = cv.getContext('2d');
    const g = x.createLinearGradient(0, 0, N, N); g.addColorStop(0, '#173A2A'); g.addColorStop(1, '#2A6B49');
    x.fillStyle = g; x.fillRect(0, 0, N, N);
    x.fillStyle = '#5DB37E'; x.beginPath(); x.arc(N * .86, N * .14, N * .2, 0, 7); x.fill();
    x.fillStyle = '#F2C94C'; x.beginPath(); x.arc(N / 2, N / 2, N * .31, 0, 7); x.fill();
    x.fillStyle = '#FFFFFF'; x.beginPath(); x.arc(N / 2, N / 2, N * .26, 0, 7); x.fill();
    x.strokeStyle = '#173A2A'; x.lineWidth = N * .035; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(N * .45, N * .36); x.lineTo(N * .45, N * .64); x.moveTo(N * .38, N * .36); x.lineTo(N * .38, N * .47); x.moveTo(N * .52, N * .36); x.lineTo(N * .52, N * .47); x.moveTo(N * .38, N * .47); x.quadraticCurveTo(N * .45, N * .53, N * .52, N * .47); x.stroke();
    x.beginPath(); x.moveTo(N * .6, N * .64); x.lineTo(N * .6, N * .36); x.quadraticCurveTo(N * .68, N * .42, N * .62, N * .52); x.stroke();
    const png = cv.toDataURL('image/png');
    const add = (tag, attrs) => { const el = document.createElement(tag); for (const k in attrs) el.setAttribute(k, attrs[k]); document.head.appendChild(el); };
    add('link', { rel: 'icon', type: 'image/png', href: png });
    add('link', { rel: 'apple-touch-icon', href: png });
    add('meta', { name: 'theme-color', content: '#173A2A' });
    add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
    add('meta', { name: 'mobile-web-app-capable', content: 'yes' });
    add('meta', { name: 'apple-mobile-web-app-title', content: 'Recept' });
    add('meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'black-translucent' });
    const man = { name: 'Receptsamlingen', short_name: 'Recept', lang: 'sv', display: 'standalone', start_url: location.href, scope: location.origin + '/', background_color: '#173A2A', theme_color: '#173A2A',
      icons: [{ src: png, sizes: '512x512', type: 'image/png', purpose: 'any' }] };
    add('link', { rel: 'manifest', href: 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)) });
  } catch (e) { /* ikonen är en bekvämlighet */ }
}

/* Bakåtknappen: stänger först öppna rutor, går upp en nivå i appen, och frågar sist om appen ska stängas.
   Gäller bara den fristående appen. Posten som fångar bakåt läggs in först vid första tryck,
   eftersom Chrome hoppar över historikposter som skapats utan att man rört sidan. */
function initBackGuard() {
  if (!STANDALONE || !window.history || !history.pushState) return;
  let armed = false, leaving = false;
  const push = () => { try { history.pushState({ rs: 'guard' }, ''); } catch (e) { /* */ } };
  const arm = () => { if (armed) return; armed = true; try { history.replaceState({ rs: 'base' }, ''); } catch (e) { /* */ } push(); };
  document.addEventListener('click', arm, { capture: true, once: true });
  document.addEventListener('keydown', arm, { capture: true, once: true });
  window.addEventListener('popstate', () => {
    if (!armed || leaving) return;
    push(); // nästa bakåttryck ska också fångas
    const top = sheets[sheets.length - 1];
    if (top) { top.close(); return; }
    if (S.view === 'books' && S.bookId) { S.bookId = null; render(); window.scrollTo(0, 0); return; }
    if (S.view === 'books') { go('recipes'); return; }
    confirmDialog({ title: 'Stänga appen?', body: h('p', null, 'Vill du stänga Receptsamlingen eller stanna kvar?'), confirmLabel: 'Stäng appen', cancelLabel: 'Stanna kvar' }).then(ok => {
      if (!ok) return;
      leaving = true;
      history.go(-2);
      setTimeout(() => { // kvar här betyder att det inte fanns något att gå tillbaka till
        try { history.go(-1); } catch (e) { /* */ }
        try { window.close(); } catch (e) { /* */ }
        toast('Tryck på bakåt en gång till för att stänga appen.');
      }, 450);
    });
  });
}

async function start() {
  const app = $('#app');
  app.innerHTML = ''; app.lang = 'sv';
  installHomeIcon();
  app.append(
    h('header', { class: 'hero', id: 'hero' },
      h('div', { class: 'hero-top' }, h('h1', null, 'Receptsamlingen'),
        h('button', { type: 'button', class: 'more', 'aria-label': 'Mer: taggar och säkerhetskopia', title: 'Mer', onclick: openMore }, icon('dots'))),
      h('div', { class: 'hero-row' }, h('p', { class: 'sub', id: 'herosub' }, '')),
      h('nav', { class: 'tabs', role: 'tablist', 'aria-label': 'Huvudvyer' },
        h('button', { type: 'button', class: 'tab', role: 'tab', 'data-view': 'recipes', 'aria-selected': 'true', onclick: () => go('recipes') }, icon('utensils'), 'Hitta recept'),
        h('button', { type: 'button', class: 'tab', role: 'tab', 'data-view': 'books', 'aria-selected': 'false', onclick: () => go('books') }, icon('book'), 'Bokhyllan'))),
    h('main', { id: 'main', 'aria-live': 'off' }, h('p', { class: 'muted' }, 'Laddar…')));
  await Store.init();
  try { await loadState(); }
  catch (e) { console.error(e); $('#main').textContent = ''; $('#main').appendChild(h('div', { class: 'note bad', role: 'alert' }, 'Samlingen kunde inte läsas: ' + (e && e.message || 'okänt fel') + '. Inget har ändrats. Ladda om sidan.')); return; }
  await Cloud.init();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* valfritt */ }
  render();
  paintBackupDot();
  initBackGuard();
  if (STANDALONE && !window.__NOSW__ && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  Cloud.sync().then(r => {
    if (r.did === 'pull') { S.f = Core.emptyFilters(); S.bookId = null; render(); toast('Hämtade ' + plural(r.n, 'recept', 'recept') + ' från ditt konto.'); }
    if (r.did === 'error' && !Cloud.warned) { Cloud.warned = true; toast('Kunde inte nå kopian i kontot. Samlingen i telefonen är oförändrad.', { bad: true }); }
  });
  if (Store.volatile) toast('Sparandet fungerar inte i den här vyn. Det du lägger till finns kvar tills du stänger sidan.', { bad: true });
}
start();

})();
